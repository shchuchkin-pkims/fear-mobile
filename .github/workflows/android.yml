name: Build Android APK

# Builds the F.E.A.R. Android client. The CI runner does not own the
# release keystore, so the APK it builds is debug-signed - installable on any
# device, but not over a release-signed build (Android refuses to overlay
# different signatures).
#
# That is why this workflow never attaches its APK to a release. The in-app
# updater installs the first .apk it finds in the latest release; a
# debug-signed one there would fail to install on every phone that has the
# app. The release APK is built with the release key and attached by the
# maintainer (./gradlew assembleRelease).
#
# Triggers:
#   - push to main or dev - runs the unit tests, builds the APK and uploads
#     it as a build artifact (kept for 90 days, link in the run page);
#   - tag v* - the same, as a check of the tagged commit;
#   - workflow_dispatch - "Run workflow" button in Actions.

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Android (Gradle / debug-signed APK)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The runner image ships an Android SDK. android-actions/setup-android@v3
      # began failing on it in October 2026 - its sdkmanager stopped at the
      # license review and exited 1 - so use the SDK that is there and accept
      # its licenses here; Gradle then fetches whatever platform it lacks.
      # (yes || true): yes dies of SIGPIPE when sdkmanager is done, and under
      # pipefail that would fail the step.
      - name: Accept Android SDK licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Stage APK
        run: |
          set -e
          tag="${{ github.ref_name }}"
          sha=$(echo "${{ github.sha }}" | cut -c1-7)
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            name="fear-android-${tag}.apk"
          else
            name="fear-android-${tag//\//_}-${sha}.apk"
          fi
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/${name}"
          echo "APK_NAME=${name}" >> "$GITHUB_ENV"
          ls -la release/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: release/${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 90
